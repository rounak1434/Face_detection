[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-surveillance-inference"
version = "0.1.0"
description = "Internal face-analysis inference service for the AI Surveillance Web Application"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.4,<3",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "pillow>=10.4,<13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27,<1",
  "ruff>=0.15",
]

[tool.setuptools.packages.find]
include = ["inference_service*"]

# Same lint rules as the backend (see backend/pyproject.toml).
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "model: needs the real model files (run `python -m inference_service.download` first)",
]
