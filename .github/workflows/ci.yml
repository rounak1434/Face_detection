# Tests, lint and build for every push and pull request.
# Unit tests only: the integration tests need the running Docker stack
# (deploy/run-integration-tests.sh on the Ubuntu host).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # the version in backend/Dockerfile
          cache: pip
          cache-dependency-path: backend/constraints.txt
      - name: Install (pinned)
        run: pip install -c constraints.txt -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: python -m pytest -p no:cacheprovider -m "not integration" -rs

  inference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: inference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # the version in inference/Dockerfile
          cache: pip
          cache-dependency-path: inference/constraints.txt
      - name: Install (pinned)
        run: pip install -c constraints.txt -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Download and verify the model (size and SHA-256)
        run: python -m inference_service.download --models-dir models
      - name: Tests (including the real model)
        run: python -m pytest -p no:cacheprovider -rs

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Type check and build
        run: npm run build
