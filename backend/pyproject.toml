[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-surveillance-api"
version = "0.1.0"
description = "Web API for the AI Surveillance Web Application"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "websockets>=13,<16",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "argon2-cffi>=23.1",
  "cryptography>=42",
  "alembic>=1.13,<2",
  "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "respx>=0.21",
  "pyyaml>=6",
  "ruff>=0.15",
]

[project.scripts]
ai-surveillance = "ai_surveillance.cli:main"

[tool.setuptools.packages.find]
include = ["ai_surveillance*"]

# Migration scripts are loaded from files by Alembic, not imported as a
# package, so they must be shipped explicitly.
[tool.setuptools.package-data]
ai_surveillance = ["migrations/script.py.mako", "migrations/versions/*.py"]

# Lint for likely bugs (pyflakes, pycodestyle errors, bugbear), run in CI.
# E501: long lines are a style matter here, not a CI failure.
# B008: FastAPI's Depends()/Query() defaults are the framework's idiom.
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs the live docker stack (Frigate + test stream); skipped by default",
]
addopts = "-m 'not integration'"
