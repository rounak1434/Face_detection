[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-surveillance-api"
version = "0.1.0"
description = "Web API for the AI Surveillance Web Application"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "websockets>=13,<16",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "respx>=0.21",
]

[project.scripts]
ai-surveillance = "ai_surveillance.cli:main"

[tool.setuptools.packages.find]
include = ["ai_surveillance*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs the live docker stack (Frigate + test stream); skipped by default",
]
addopts = "-m 'not integration'"
