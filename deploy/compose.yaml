# AI Surveillance stack.
#
#   docker compose up -d --build                  # uses deploy/.env; the example enables
#                                                 # the synthetic test stream (COMPOSE_PROFILES)
#   docker compose down                           # stop, keeping data
#   add -f compose.yaml -f compose.nvidia.yaml    # optional: give Frigate the NVIDIA GPU
#
# Only the web container publishes ports to the LAN. Frigate's unauthenticated
# port 5000 stays on the internal network; its authenticated UI (8971) is bound
# to the host's loopback for administrator use over SSH tunnel.

name: ai-surveillance

services:
  # One-shot, before Frigate (ADR-0003): seeds Frigate's live config from the
  # tracked template only if none exists yet (it then belongs to Frigate and
  # "Apply to Frigate"; git never changes it), and prepares the secrets
  # volume so only the api user (uid 10001) may write it. Same image as
  # Frigate, so nothing extra is downloaded; no network.
  frigate-init:
    image: ghcr.io/blakeblackshear/frigate:0.18.2
    restart: "no"
    network_mode: none
    entrypoint:
      - sh
      - -c
      - >-
        set -e;
        [ -f /config/config.yml ] || cp /template/config.yml /config/config.yml;
        chown 10001 /secrets; chmod 700 /secrets
    volumes:
      - ./frigate/config.yml:/template/config.yml:ro
      - ./storage/frigate-config:/config
      - frigate-secrets:/secrets

  frigate:
    # Standard image (CPU detector). compose.nvidia.yaml switches to the
    # -tensorrt image and passes the GPU through.
    image: ghcr.io/blakeblackshear/frigate:0.18.2
    restart: unless-stopped
    shm_size: "256mb"
    environment:
      TZ: ${TZ:-UTC}
      FRIGATE_CAMERA_MAIN_URL: ${FRIGATE_CAMERA_MAIN_URL:?set FRIGATE_CAMERA_MAIN_URL in .env}
      FRIGATE_CAMERA_SUB_URL: ${FRIGATE_CAMERA_SUB_URL:?set FRIGATE_CAMERA_SUB_URL in .env}
    volumes:
      # Live config (written by "Apply to Frigate" through Frigate's API), database, model cache.
      - ./storage/frigate-config:/config
      # Saved devices' stream URLs, one file per stream, written by the api. Frigate and its go2rtc
      # read /run/secrets at startup (frigate/config/env.py, go2rtc/create_config.py).
      - frigate-secrets:/run/secrets:ro
      - ./storage/frigate-media:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "127.0.0.1:8971:8971"
    depends_on:
      frigate-init:
        condition: service_completed_successfully
    networks: [internal]

  api:
    build: ../backend
    restart: unless-stopped
    # Variables are listed one by one so camera credentials in .env are not
    # handed to this container.
    environment:
      APP_DISPLAY_NAME: ${APP_DISPLAY_NAME:-AI Surveillance}
      DATABASE_URL: sqlite:////data/app.db
      MEDIA_ROOT: /data/media
      FRIGATE_URL: ${FRIGATE_URL:-http://frigate:5000}
      FRIGATE_USERNAME: ${FRIGATE_USERNAME:-}
      FRIGATE_PASSWORD: ${FRIGATE_PASSWORD:-}
      FRIGATE_VERIFY_TLS: ${FRIGATE_VERIFY_TLS:-true}
      # "Apply to Frigate" (ADR-0003): template in, secret files out.
      FRIGATE_CONFIG_TEMPLATE: /app/frigate-template/config.yml
      FRIGATE_SECRETS_DIR: /frigate-secrets
      FRIGATE_PREVIOUS_CONFIG_FILE: /data/frigate-config.previous.yml
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      CLIP_DEFAULT_SECONDS: ${CLIP_DEFAULT_SECONDS:-10}
      CLIP_MAX_SECONDS: ${CLIP_MAX_SECONDS:-60}
      CLIP_KEEP_FRIGATE_EXPORT: ${CLIP_KEEP_FRIGATE_EXPORT:-false}
      CAPTURE_MIN_FREE_MB: ${CAPTURE_MIN_FREE_MB:-1024}
      CAPTURE_RETENTION_DAYS: ${CAPTURE_RETENTION_DAYS:-0}
      CREDENTIALS_KEY_FILE: /data/credentials.key
      DEVICE_ALLOWED_NETWORKS: ${DEVICE_ALLOWED_NETWORKS:-192.168.0.0/16,10.0.0.0/8}
      SYNTHETIC_RTSP_URL: rtsp://test-stream:8554/test
      INFERENCE_URL: http://inference:8100
      INFERENCE_API_TOKEN: ${INFERENCE_API_TOKEN:-}
      ANALYSIS_MAX_IMAGE_BYTES: ${ANALYSIS_MAX_IMAGE_BYTES:-10485760}
      TZ: ${TZ:-UTC}
    # A named volume, so the non-root api user owns it (a bind mount would
    # be created root-owned and the service could not write its database).
    volumes:
      - api-data:/data
      - ./frigate/config.yml:/app/frigate-template/config.yml:ro
      - frigate-secrets:/frigate-secrets
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on: [frigate, inference]
    networks: [internal]

  # Face analysis models (YuNet so far). Models are downloaded and verified
  # when the image is built; at run time it needs no internet and keeps no
  # images. Internal network only: no published ports.
  inference:
    build: ../inference
    restart: unless-stopped
    environment:
      INFERENCE_MAX_IMAGE_BYTES: ${ANALYSIS_MAX_IMAGE_BYTES:-10485760}
      # Same value as the api's: only the api may call the detector.
      INFERENCE_API_TOKEN: ${INFERENCE_API_TOKEN:-}
    # Upper bound if decoding or a model misbehaves. Sized for 2 concurrent
    # 40-megapixel images (~120 MB RGB each, plus copies and OpenCV buffers).
    # Raise INFERENCE_MEM_LIMIT in .env if larger models are added later.
    mem_limit: ${INFERENCE_MEM_LIMIT:-1536m}
    networks: [internal]

  web:
    build: ../frontend
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [api]
    networks: [internal]

  # Synthetic RTSP source for testing without camera hardware.
  test-stream:
    profiles: [test-stream]
    image: bluenviron/mediamtx:1.9.3-ffmpeg
    restart: unless-stopped
    volumes:
      - ./test-stream/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "127.0.0.1:8554:8554"
    networks: [internal]

networks:
  internal: {}

volumes:
  api-data: {}
  caddy-data: {}
  # Shared only by the api (read-write) and Frigate (read-only).
  frigate-secrets: {}
