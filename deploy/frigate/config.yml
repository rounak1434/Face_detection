# Frigate configuration for milestone 1: one camera, live restream, recording,
# snapshots. Stream URLs come from environment variables (deploy/.env), so no
# credentials are stored here.
#
# Detection uses Frigate's default CPU detector for now. Switching to the
# NVIDIA GPU (ONNX + YOLOv9) is a separate, measured step: see the commented
# block below and docs/SETUP.md.

mqtt:
  enabled: false # event bus arrives in milestone 2

auth:
  enabled: true # applies to port 8971; create the first user from the logs on first start

go2rtc:
  streams:
    entrance:
      - "{FRIGATE_CAMERA_MAIN_URL}"
    entrance_sub:
      - "{FRIGATE_CAMERA_SUB_URL}"

cameras:
  entrance:
    enabled: true
    ffmpeg:
      output_args:
        record: preset-record-generic-audio-copy
      inputs:
        # Read through go2rtc so the camera/NVR sees one connection per stream.
        - path: rtsp://127.0.0.1:8554/entrance
          input_args: preset-rtsp-restream
          roles: [record]
        - path: rtsp://127.0.0.1:8554/entrance_sub
          input_args: preset-rtsp-restream
          roles: [detect]
    detect:
      enabled: true
      width: 1280 # must match the sub stream; adjust after probing the NVR
      height: 720
      fps: 5
    live:
      streams:
        Main: entrance
        Sub: entrance_sub
    objects:
      track: [person]
    record:
      enabled: true
      retain:
        days: 3
        mode: all
    snapshots:
      enabled: true
      retain:
        default: 14

